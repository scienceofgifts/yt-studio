<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" />
  
  <!-- Subtle border ring -->
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Outer ambient aura glow -->
  <circle cx="32" cy="32" r="22" fill="url(#sparkleGlow)" opacity="0.6" />

  <!-- Atmospheric mountain / landscape silhouette waves -->
  <path d="M8 48 C 18 42, 28 44, 36 38 C 44 32, 54 40, 56 48 L 56 52 L 8 52 Z" fill="#1e1b4b" opacity="0.8" />
  <path d="M8 50 C 20 46, 32 48, 42 43 C 50 40, 56 46, 56 50 Z" fill="#f59e0b" opacity="0.15" />

  <!-- Central Ambient Sparkle / Celestial Beacon -->
  <g filter="url(#glow)">
    <!-- 4-point sparkle star -->
    <path d="M32 14 Q32 32 50 32 Q32 32 32 50 Q32 32 14 32 Q32 32 32 14 Z" fill="url(#starGrad)" />
    <!-- Secondary small sparkle offset -->
    <path d="M46 16 Q46 22 52 22 Q46 22 46 28 Q46 22 40 22 Q46 22 46 16 Z" fill="#fef08a" opacity="0.9" />
    <circle cx="20" cy="20" r="1.5" fill="#fef08a" opacity="0.7" />
  </g>
</svg>
